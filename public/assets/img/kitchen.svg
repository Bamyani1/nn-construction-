<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ECF1F7"></stop>
      <stop offset="0.5" stop-color="#DDE5EF"></stop>
      <stop offset="1" stop-color="#CBD5E1"></stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#1E3A5F" stop-opacity="0.28"></stop>
      <stop offset="0.5" stop-color="#2556A8" stop-opacity="0.1"></stop>
      <stop offset="1" stop-color="#ECF1F7" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7FAFC"></stop>
      <stop offset="1" stop-color="#DDE5EF"></stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#floor)"></rect>
  <rect width="1200" height="680" fill="url(#glow)"></rect>

  <rect x="180" y="120" width="840" height="360" fill="url(#wall)"></rect>

  <g stroke="#64748B" stroke-width="1" fill="#CBD5E1">
    <rect x="220" y="260" width="120" height="180"></rect>
    <rect x="350" y="260" width="120" height="180"></rect>
    <rect x="480" y="260" width="120" height="180"></rect>
    <rect x="610" y="260" width="120" height="180"></rect>
    <rect x="740" y="260" width="120" height="180"></rect>
    <rect x="870" y="260" width="120" height="180"></rect>
  </g>

  <rect x="200" y="250" width="820" height="14" fill="#0B1A2E" opacity="0.08"></rect>
  <rect x="200" y="250" width="820" height="2" fill="#1E3A5F" opacity="0.35"></rect>

  <line x1="600" y1="120" x2="600" y2="200" stroke="#1E3A5F" stroke-width="1" opacity="0.6"></line>
  <circle cx="600" cy="208" r="10" fill="#1E3A5F" opacity="0.7"></circle>
  <circle cx="600" cy="208" r="30" fill="#1E3A5F" opacity="0.18"></circle>
  <circle cx="600" cy="208" r="80" fill="#1E3A5F" opacity="0.06"></circle>

  <g stroke="#0B1A2E" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="500" x2="1200" y2="500"></line>
    <line x1="0" y1="540" x2="1200" y2="540"></line>
    <line x1="0" y1="580" x2="1200" y2="580"></line>
    <line x1="0" y1="620" x2="1200" y2="620"></line>
  </g>

  <rect width="1200" height="680" fill="#000" opacity="0.04"></rect>
</svg>